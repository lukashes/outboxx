# Outboxx Development Configuration
# This config allows you to run the binary and test CDC functionality
#
# Usage: start the stack with `make env-up`, then `make run` (it points here and
# defaults POSTGRES_URL to the local dev database). Override POSTGRES_URL to use
# another database, or use ./dev/run-dev.sh for a scripted start.

[metadata]
version = "v0"

[source]
type = "postgres" # Reference to the "source.postgres"

[source.postgres]
# libpq connection string (URL or DSN) lives in this env var, kept out of the file so the
# password never lands on disk. Local Postgres has no TLS, hence sslmode=disable in the URL;
# use require or verify-full in production.
connection_env = "POSTGRES_URL"
slot_name = "outboxx_slot"
publication_name = "outboxx_publication"

[sink]
type = "kafka" # Reference to the "sink.kafka"

[sink.kafka]
brokers = ["localhost:9092"]
tls = false  # local Kafka has no TLS; encryption is on by default otherwise

# Prometheus /metrics plus /healthz and /readyz. Omit this section to disable.
[observability]
address = "127.0.0.1"
port = 9464

# Multiple streams can be defined to capture changes from different resources
[[streams]]
name = "users_dev_stream" # Name could be used for logging or metrics and new entites

[streams.source]
resource = "users" # Table or collection name in the source database
operations = ["insert", "update"]

[streams.flow]
format = "json" # Only "json" format is currently supported

[streams.sink]
destination = "outboxx.users" # Kafka topic name
routing_key = "id" # Field used for partitioning in Kafka

# Second stream example
[[streams]]
name = "orders_dev_stream"

[streams.source]
resource = "orders"
operations = ["insert", "update"]

[streams.flow]
format = "json"

[streams.sink]
destination = "outboxx.orders"
routing_key = "id"
