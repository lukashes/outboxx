# Outboxx configuration example.
#
# Streams row changes from PostgreSQL to Kafka. Every option below is implemented.
# Secrets stay out of this file: the full connection string (with the password)
# is supplied through an environment variable.
#
#   export POSTGRES_URL="postgres://user:pass@host:5432/db?sslmode=require"
#   export KAFKA_PASSWORD="..."   # only when using SASL (see below)

[metadata]
version = "v0"

[source]
type = "postgres"

[source.postgres]
# Name of the env var holding a full libpq connection string (URL or DSN). Keeping
# it out of the file means the password never lands on disk. TLS is configured
# inside the string via the standard libpq parameters:
#   sslmode = disable | allow | prefer | require | verify-ca | verify-full
#   sslrootcert, sslcert, sslkey
# Without an explicit sslmode libpq defaults to prefer (opportunistic, unverified);
# use require or verify-full to enforce and pin the CA in production.
connection_env = "POSTGRES_URL"
slot_name = "outboxx_slot"
publication_name = "outboxx_publication"

[sink]
type = "kafka"

[sink.kafka]
brokers = ["localhost:9092"]
tls = true                                   # on by default; set false for local plaintext
# tls_ca_location = "/etc/ssl/certs/ca.pem"  # optional: CA bundle to verify the broker

# Optional SASL authentication, required by managed brokers (MSK, Confluent Cloud).
# The password is read from the named env var, never stored here.
# [sink.kafka.sasl]
# mechanism = "SCRAM-SHA-512"                # PLAIN | SCRAM-SHA-256 | SCRAM-SHA-512
# username = "app_user"
# password_env = "KAFKA_PASSWORD"

# Optional Prometheus metrics and health endpoints. Omit this section to disable
# the HTTP server. Exposes /metrics (Prometheus text), /healthz (liveness) and
# /readyz (readiness); no secrets are served on these endpoints.
[observability]
address = "0.0.0.0"  # 127.0.0.1 to keep it local; 0.0.0.0 for container scraping
port = 9464          # conventional OpenTelemetry Prometheus exporter port

# Optional initial snapshot. Omit this section to keep the default "initial".
# "initial" reads existing rows once, only on a freshly created slot and only for
# streams that list "read" (below), and emits them as op="READ" before streaming;
# "no-snapshot" disables it regardless of the per-stream opt-in. Re-bootstrapping a
# table means a new slot, since an existing slot has no consistent snapshot to read.
[snapshot]
mode = "initial"  # initial | no-snapshot

# One [[streams]] block per table -> topic mapping.
[[streams]]
name = "users-stream"

[streams.source]
resource = "users"                                   # table; use "schema.table" for a non-public schema (default: public)
operations = ["read", "insert", "update", "delete"]  # subset of read | insert | update | delete; "read" opts into the initial snapshot

[streams.flow]
format = "json"                              # only json is supported

[streams.sink]
destination = "public.users"                 # Kafka topic
routing_key = "id"                           # column used as the partition key (default: id)

[[streams]]
name = "orders-stream"

[streams.source]
resource = "orders"
operations = ["insert", "update"]

[streams.flow]
format = "json"

[streams.sink]
destination = "public.orders"
routing_key = "id"
