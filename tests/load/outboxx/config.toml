[metadata]
version = "v0"

[source]
type = "postgres"

[source.postgres]
connection_env = "POSTGRES_URL"
slot_name = "outboxx_benchmark_slot"
publication_name = "outboxx_benchmark_publication"

[sink]
type = "kafka"

[sink.kafka]
brokers = ["kafka:9092"]
tls = false  # the benchmark broker is plaintext

# Expose /metrics so Prometheus scrapes throughput and lag straight from outboxx,
# instead of inferring them from kafka-exporter/cadvisor. 0.0.0.0 so the Prometheus
# container can reach it over the compose network.
[observability]
address = "0.0.0.0"
port = 9464

[[streams]]
name = "benchmark-records"

[streams.source]
resource = "benchmark_records"
operations = ["insert", "update", "delete"]

[streams.flow]
format = "json"

[streams.sink]
destination = "outboxx.public.benchmark_records"
routing_key = "id"
