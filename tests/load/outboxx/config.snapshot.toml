# Initial-snapshot scenario: config.toml plus `read`, which opts the stream into
# the bootstrap. That alone is not enough, the snapshot also needs outboxx to
# create the slot itself, so the snapshot-* make targets drop the slots first.

[metadata]
version = "v0"

[source]
type = "postgres"

[source.postgres]
connection_env = "POSTGRES_URL"
slot_name = "outboxx_benchmark_slot"
publication_name = "outboxx_benchmark_publication"

[sink]
type = "kafka"

[sink.kafka]
brokers = ["kafka:9092"]
tls = false  # the benchmark broker is plaintext

[observability]
address = "0.0.0.0"
port = 9464

[[streams]]
name = "benchmark-records"

[streams.source]
resource = "benchmark_records"
operations = ["read", "insert", "update", "delete"]

[streams.flow]
format = "json"

[streams.sink]
destination = "outboxx.public.benchmark_records"
routing_key = "id"
