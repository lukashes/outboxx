name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]
  # Reused by release-preflight.yml on PRs labeled `release`: everything is
  # built and smoke-tested, nothing is pushed or published.
  workflow_call:
    inputs:
      dry-run:
        description: Build and smoke-test everything, publish nothing
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/lukashes/outboxx

jobs:
  docker-image:
    name: Docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version="$(awk -F'"' '/\.version =/ {print $2; exit}' build.zig.zon)"
          if [ -z "$version" ]; then
            echo "failed to read .version from build.zig.zon" >&2
            exit 1
          fi
          # A tag must release exactly the version the source claims, or the
          # image/binary labels and the tag would disagree.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match build.zig.zon version v${version}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: inputs.dry-run != true
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build \
            --build-arg VERSION="${VERSION}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --tag "${IMAGE_NAME}:${VERSION}-${ARCH}" \
            --tag "${IMAGE_NAME}:${VERSION}-${{ github.run_number }}-${ARCH}" \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA::12}-${ARCH}" \
            .
          docker run --rm "${IMAGE_NAME}:${VERSION}-${ARCH}" --version

      - name: Push image
        if: inputs.dry-run != true
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker push "${IMAGE_NAME}:${VERSION}-${ARCH}"
          docker push "${IMAGE_NAME}:${VERSION}-${{ github.run_number }}-${ARCH}"
          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA::12}-${ARCH}"

  publish:
    name: Publish multi-arch tags
    if: inputs.dry-run != true
    runs-on: ubuntu-24.04
    needs: docker-image

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version="$(awk -F'"' '/\.version =/ {print $2; exit}' build.zig.zon)"
          if [ -z "$version" ]; then
            echo "failed to read .version from build.zig.zon" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish multi-arch image tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for tag in "${VERSION}" "v${VERSION}" "${VERSION}-${{ github.run_number }}" "latest" "sha-${GITHUB_SHA::12}"; do
            docker buildx imagetools create \
              --tag "${IMAGE_NAME}:${tag}" \
              "${IMAGE_NAME}:${VERSION}-amd64" \
              "${IMAGE_NAME}:${VERSION}-arm64"
          done

      - name: Report image digest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" | awk '/^Digest:/ {print $2; exit}')"
          {
            echo "## Published image"
            echo
            echo "- Image: \`${IMAGE_NAME}:${VERSION}\`"
            echo "- Digest: \`${IMAGE_NAME}@${digest}\`"
            echo "- Build tag: \`${IMAGE_NAME}:${VERSION}-${{ github.run_number }}\`"
            echo "- Commit tag: \`${IMAGE_NAME}:sha-${GITHUB_SHA::12}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Portable standalone binaries: static musl builds, so unlike the nix-built
  # image binary they carry no /nix/store paths and run on any Linux.
  binary:
    name: Static binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            zig_target: x86_64-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            zig_target: aarch64-linux-musl

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version="$(awk -F'"' '/\.version =/ {print $2; exit}' build.zig.zon)"
          if [ -z "$version" ]; then
            echo "failed to read .version from build.zig.zon" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match build.zig.zon version v${version}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Build static binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          deps="$(nix build .#static-deps --print-out-paths)"
          nix develop --command bash -c "
            export C_INCLUDE_PATH=\"$deps/include\"
            zig build -Doptimize=ReleaseSafe -Dcpu=baseline -Dversion=\"$VERSION\" \
              -Dtarget=\"$ZIG_TARGET\" -Dstatic-deps=true --search-prefix \"$deps\"
          "
          # Native arch matches the target, so the binary must run right here.
          ./zig-out/bin/outboxx --version
          tar -czf "outboxx-${VERSION}-linux-${{ matrix.arch }}.tar.gz" -C zig-out/bin outboxx

      # A released build must do more than print its version: run the full e2e
      # suite (INSERT/UPDATE/DELETE through Postgres -> CDC -> Kafka) built
      # against the exact static link set. Services mirror pr-checks.yml,
      # minus the TLS listener the e2e tests do not use.
      - name: Start Postgres and Kafka
        run: |
          docker run -d --name pg --network host \
            -e POSTGRES_PASSWORD=password \
            -e POSTGRES_DB=outboxx_test \
            -e POSTGRES_INITDB_ARGS="-c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10 -c max_logical_replication_workers=4" \
            postgres:17
          docker run -d --name kafka --network host \
            -e KAFKA_CFG_NODE_ID=1 \
            -e KAFKA_CFG_PROCESS_ROLES=broker,controller \
            -e KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@localhost:19093 \
            -e KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:19093 \
            -e KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT \
            -e KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_KRAFT_CLUSTER_ID=preflight-cluster-id \
            -e ALLOW_PLAINTEXT_LISTENER=yes \
            -e KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true \
            bitnamilegacy/kafka:latest
          # Host-side pg_isready: the temporary initdb server listens only on
          # the unix socket, so the TCP port only answers once the real one is up.
          until pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; do sleep 1; done
          PGPASSWORD=password psql -h localhost -p 5432 -U postgres -d outboxx_test -f dev/postgres/postgres-init.sql
          timeout 90s bash -c 'until nc -z localhost 9092; do sleep 2; done'

      - name: Run e2e tests against the static build
        env:
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          deps="$(nix build .#static-deps --print-out-paths)"
          nix develop --command bash -c "
            export C_INCLUDE_PATH=\"$deps/include\"
            zig build test-e2e -Dstatic-deps=true -Dtarget=\"$ZIG_TARGET\" --search-prefix \"$deps\"
          "

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== kafka ==="; docker logs kafka 2>&1 | tail -40
          echo "=== postgres ==="; docker logs pg 2>&1 | tail -40

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: outboxx-*.tar.gz
          if-no-files-found: error

  github-release:
    name: GitHub release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: [publish, binary]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Collect release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section for this version in CHANGELOG.md: from its "## X.Y.Z"
          # heading (exclusive) to the next "## " heading.
          awk -v ver="$version" '/^## / { on = ($2 == ver); next } on' CHANGELOG.md > notes.md
          if ! [ -s notes.md ]; then
            echo "CHANGELOG.md has no \"## ${version}\" section; move Unreleased under it before tagging" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" outboxx-*.tar.gz \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md
