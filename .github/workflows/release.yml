name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]
  # Reused by release-preflight.yml on PRs labeled `release`: everything is
  # built and smoke-tested, nothing is pushed or published.
  workflow_call:
    inputs:
      dry-run:
        description: Build and smoke-test everything, publish nothing
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/lukashes/outboxx

jobs:
  docker-image:
    name: Docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version="$(awk -F'"' '/\.version =/ {print $2; exit}' build.zig.zon)"
          if [ -z "$version" ]; then
            echo "failed to read .version from build.zig.zon" >&2
            exit 1
          fi
          # A tag must release exactly the version the source claims, or the
          # image/binary labels and the tag would disagree.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match build.zig.zon version v${version}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: inputs.dry-run != true
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build \
            --build-arg VERSION="${VERSION}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --tag "${IMAGE_NAME}:${VERSION}-${ARCH}" \
            --tag "${IMAGE_NAME}:${VERSION}-${{ github.run_number }}-${ARCH}" \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA::12}-${ARCH}" \
            .
          docker run --rm "${IMAGE_NAME}:${VERSION}-${ARCH}" --version

      - name: Push image
        if: inputs.dry-run != true
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker push "${IMAGE_NAME}:${VERSION}-${ARCH}"
          docker push "${IMAGE_NAME}:${VERSION}-${{ github.run_number }}-${ARCH}"
          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA::12}-${ARCH}"

  publish:
    name: Publish multi-arch tags
    if: inputs.dry-run != true
    runs-on: ubuntu-24.04
    needs: docker-image

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version="$(awk -F'"' '/\.version =/ {print $2; exit}' build.zig.zon)"
          if [ -z "$version" ]; then
            echo "failed to read .version from build.zig.zon" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish multi-arch image tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for tag in "${VERSION}" "v${VERSION}" "${VERSION}-${{ github.run_number }}" "latest" "sha-${GITHUB_SHA::12}"; do
            docker buildx imagetools create \
              --tag "${IMAGE_NAME}:${tag}" \
              "${IMAGE_NAME}:${VERSION}-amd64" \
              "${IMAGE_NAME}:${VERSION}-arm64"
          done

      - name: Report image digest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" | awk '/^Digest:/ {print $2; exit}')"
          {
            echo "## Published image"
            echo
            echo "- Image: \`${IMAGE_NAME}:${VERSION}\`"
            echo "- Digest: \`${IMAGE_NAME}@${digest}\`"
            echo "- Build tag: \`${IMAGE_NAME}:${VERSION}-${{ github.run_number }}\`"
            echo "- Commit tag: \`${IMAGE_NAME}:sha-${GITHUB_SHA::12}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Portable standalone binaries: static musl builds, so unlike the nix-built
  # image binary they carry no /nix/store paths and run on any Linux.
  binary:
    name: Static binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            zig_target: x86_64-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            zig_target: aarch64-linux-musl

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version="$(awk -F'"' '/\.version =/ {print $2; exit}' build.zig.zon)"
          if [ -z "$version" ]; then
            echo "failed to read .version from build.zig.zon" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match build.zig.zon version v${version}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Build static binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          deps="$(nix build .#static-deps --print-out-paths)"
          nix develop --command bash -c "
            export C_INCLUDE_PATH=\"$deps/include\"
            zig build -Doptimize=ReleaseSafe -Dcpu=baseline -Dversion=\"$VERSION\" \
              -Dtarget=\"$ZIG_TARGET\" -Dstatic-deps=true --search-prefix \"$deps\"
          "
          # Native arch matches the target, so the binary must run right here.
          ./zig-out/bin/outboxx --version
          tar -czf "outboxx-${VERSION}-linux-${{ matrix.arch }}.tar.gz" -C zig-out/bin outboxx

      # A released binary must do more than print its version: boot real
      # services and drive one change through the whole pipeline.
      - name: Smoke-test the binary end to end
        run: |
          set -euo pipefail
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:17 -c wal_level=logical
          docker run -d --name kafka -p 9092:9092 apache/kafka:3.9.0

          until docker exec pg pg_isready -U postgres >/dev/null 2>&1; do sleep 1; done
          docker exec pg psql -U postgres -c "CREATE TABLE users (id int PRIMARY KEY, name text)"
          until docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; do sleep 2; done

          cat > smoke.toml <<'TOML'
          [metadata]
          version = "v0"
          [source]
          type = "postgres"
          [source.postgres]
          connection_env = "POSTGRES_URL"
          slot_name = "smoke_slot"
          publication_name = "smoke_publication"
          [sink]
          type = "kafka"
          [sink.kafka]
          brokers = ["localhost:9092"]
          tls = false
          [observability]
          address = "127.0.0.1"
          port = 9464
          [[streams]]
          name = "users-smoke"
          [streams.source]
          resource = "users"
          operations = ["insert"]
          [streams.flow]
          format = "json"
          [streams.sink]
          destination = "smoke.users"
          routing_key = "id"
          TOML

          POSTGRES_URL="postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable" \
            ./zig-out/bin/outboxx --config smoke.toml > smoke.log 2>&1 &
          smoke_pid=$!

          for _ in $(seq 1 30); do
            grep -q "CDC processor started successfully" smoke.log && break
            sleep 2
          done
          grep "CDC processor started successfully" smoke.log
          curl -fsS -o /dev/null -w 'healthz: %{http_code}\n' http://127.0.0.1:9464/healthz

          docker exec pg psql -U postgres -c "INSERT INTO users VALUES (1, 'smoke')"
          docker exec kafka /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 --topic smoke.users \
            --from-beginning --max-messages 1 --timeout-ms 60000 > event.json
          grep '"op":"INSERT"' event.json
          cat event.json

          kill "$smoke_pid"
          docker rm -f pg kafka >/dev/null

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: outboxx-*.tar.gz
          if-no-files-found: error

  github-release:
    name: GitHub release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: [publish, binary]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Collect release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section for this version in CHANGELOG.md: from its "## X.Y.Z"
          # heading (exclusive) to the next "## " heading.
          awk -v ver="$version" '/^## / { on = ($2 == ver); next } on' CHANGELOG.md > notes.md
          if ! [ -s notes.md ]; then
            echo "CHANGELOG.md has no \"## ${version}\" section; move Unreleased under it before tagging" >&2
            exit 1
          fi

      # No binary assets: the nix-built binary hardwires its ELF interpreter to
      # a /nix/store path and only runs inside the image, which carries the
      # whole closure. Portable standalone binaries need a static build first.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md
